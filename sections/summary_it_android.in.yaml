- Sono uno sviluppatore software con oltre 14 anni di esperienza, specializzato nello sviluppo Android. Nel corso della mia carriera ho lavorato su applicazioni di diversa complessità, utilizzando Kotlin, Java e numerose tecnologie dell'ecosistema Android, occupandomi anche di architetture software e sviluppo backend.
- Mi piace approfondire le tecnologie con cui lavoro, comprenderne il funzionamento e adottare soluzioni architetturali solide e manutenibili. Ho inoltre un forte interesse per la programmazione a basso livello e i paradigmi funzionali, ambiti che sto approfondendo attraverso lo studio di Rust e Haskell.
