name: Publish PDF

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - run: pip install emrichen
    - run: pip install "rendercv[full]"
    - uses: extractions/setup-just@v4
