# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json
!Defaults
lang: en
language: !If
  test: !Op
    a: !Var lang
    op: eq
    b: it
  then: italian
  else: english
platform: generic
accent_color: !If
  test: !Op
    a: !Var platform
    op: eq
    b: android
  then: rgb(61, 220, 132)
  else: rgb(0, 79, 144)
headline_1: !If
  test: !Op
    a: !Var platform
    op: eq
    b: android
  then: Android
  else: Software
headline_2: !If
  test: !Op
    a: !Var lang
    op: eq
    b: it
  then: Developer
  else: Engineer
location: null
email: null
phone: null
---
cv:
  name: Davide Bianco
  headline: !Format "{headline_1} {headline_2} · Low-Level and Functional Enthusiast"
  location: !Var location
  email: !Var email
  photo:
  phone: !Var phone
  website:
  social_networks:
    - network: LinkedIn
      username: davidebianco
    - network: GitHub
      username: dadoself
  custom_connections:
  sections: !Include sections.in.yaml
design:
  theme: classic
  page:
    size: a4
  colors:
    name: rgb(0, 0, 0)
    headline: !Var accent_color
    connections: rgb(0, 0, 0)
    section_titles: !Var accent_color
    links: !Var accent_color
  typography:
    small_caps:
      name: true
      headline: true
    bold:
      headline: true
  templates:
    footer: '*“while (idea‑>is_not_good()) think(); write_code();” -- PAGE_NUMBER/TOTAL_PAGES*'
    education_entry:
      degree_column: null
locale:
  language: !Var language
settings:
  current_date: today
  render_command:
    output_folder: ../rendercv_output
    design:
    locale:
    typst_path: !Format "OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV_{lang}_{platform}.typ"
    pdf_path: !Format "OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV_{lang}_{platform}.pdf"
    markdown_path: !Format "OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV_{lang}_{platform}.md"
    html_path: !Format "OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV_{lang}_{platform}.html"
    png_path: !Format "OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV_{lang}_{platform}.png"
    dont_generate_markdown: false
    dont_generate_html: false
    dont_generate_typst: false
    dont_generate_pdf: false
    dont_generate_png: false
  bold_keywords: []
  pdf_title: NAME - CV
